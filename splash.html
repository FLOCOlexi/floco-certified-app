<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Nunito';src:url('assets/fonts/Nunito-Black.ttf');font-weight:900;}
@font-face{font-family:'Inter';src:url('assets/fonts/Inter-Regular.ttf');font-weight:400;}
@font-face{font-family:'Inter';src:url('assets/fonts/Inter-SemiBold.ttf');font-weight:600;}
@font-face{font-family:'Caveat';src:url('assets/fonts/Caveat-Bold.ttf');font-weight:700;}
@font-face{font-family:'Didot';src:url('assets/fonts/Didot-Italic.ttf');font-weight:400;font-style:italic;}
*{margin:0;padding:0;box-sizing:border-box;}
:root{--navy:#0A1F35;--gold:#C6A662;--gold-lt:#E4CB8E;--teal:#3BBFB8;--ink:#EAF0F3;--muted:#8DA2B5;--card:#132F4C;}
body{background:#2a2a2a;font-family:'Inter',sans-serif;}
.screen{width:390px;height:844px;position:relative;overflow:hidden;border-radius:46px;background:#0A1B2E;}
.art{position:absolute;top:0;left:0;right:0;height:500px;overflow:hidden;}
.art img{width:100%;height:100%;object-fit:cover;object-position:center 30%;}
.art .fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,20,34,.15) 0%,rgba(8,22,37,0) 45%,rgba(9,22,37,.75) 82%,#0A1B2E 100%);}
.status{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;z-index:3;}
.status .t{font-family:'Inter';font-weight:600;font-size:14px;color:#fff;}
.status .r{display:flex;gap:6px;align-items:center;}
.status .r i{display:block;width:17px;height:11px;border:1.4px solid rgba(255,255,255,.85);border-radius:3px;}
.status .r .b{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.85);}
.panel{position:absolute;left:0;right:0;bottom:0;padding:0 30px 46px;text-align:center;}
.panel .k{font-family:'Caveat';font-size:26px;color:var(--teal);line-height:.8;}
.panel h1{font-family:'Nunito';font-weight:900;font-size:30px;color:#fff;letter-spacing:-.3px;margin-top:6px;line-height:1.02;}
.panel h1 span{color:var(--gold-lt);}
.panel .sub{font-family:'Didot';font-style:italic;font-size:15px;color:#B9C6D2;margin-top:12px;line-height:1.4;}
.field{margin-top:26px;text-align:left;}
.field label{font-family:'Inter';font-weight:600;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-left:4px;}
.field .inp{margin-top:8px;height:54px;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid rgba(198,166,98,.32);
  display:flex;align-items:center;padding:0 18px;gap:12px;}
.field .inp svg{width:18px;height:18px;stroke:var(--muted);stroke-width:1.8;fill:none;}
.field .inp .ph{font-family:'Inter';font-size:15px;color:var(--muted);}
.btn{margin-top:16px;height:56px;border-radius:15px;background:linear-gradient(120deg,#D9BE7B,#C6A662);display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 8px 22px rgba(198,166,98,.28);}
.btn span{font-family:'Nunito';font-weight:900;font-size:15px;color:#0A1F35;letter-spacing:.4px;text-transform:uppercase;}
.btn svg{width:18px;height:18px;stroke:#0A1F35;stroke-width:2.4;fill:none;}
.hint{font-family:'Inter';font-size:11px;color:var(--muted);margin-top:18px;}
.hint b{color:var(--teal);}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:120px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);}
</style><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A1F35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FLOCO">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="accounts.js"></script>
<script>if(!localStorage.getItem('floco_auth_v1'))location.replace('login.html');</script>
<link rel="stylesheet" href="app.css">
<script defer src="app.js"></script>
</head>
<body>
<div class="screen">
  <div class="status"><div class="t">9:41</div><div class="r"><div class="b"></div><i></i></div></div>
  <div class="art"><img src="assets/img/app-cover.png"><div class="fade"></div></div>
  <div class="panel">
    <div class="k">welcome to</div>
    <h1>The Certified <span>Installer</span> App</h1>
    <div class="sub">Your whole FLOCO business, in your pocket.</div>
    <div class="field">
      <label>Sign in</label>
      <div class="inp"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><div class="ph">you@yourcompany.com</div></div>
    </div>
    <div class="btn"><span>Enter</span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
    <div class="hint">First time here? Your login is in your <b>welcome email.</b></div>
  </div>
  <div class="homebar"></div>
</div>
</body></html>
